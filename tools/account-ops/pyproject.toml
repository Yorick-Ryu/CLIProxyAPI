[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "cpa-account-ops"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cryptography>=44,<47"]

[project.scripts]
cpa-account-ops = "account_ops.server:main"

[tool.setuptools.packages.find]
include = ["account_ops*"]

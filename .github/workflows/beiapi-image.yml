name: Publish BeiAPI image

on:
  push:
    tags:
      - 'v*-beiapi.*'

concurrency:
  group: beiapi-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check version calculation
        run: python3 .github/scripts/test_beiapi_version.py

      - name: Fetch recorded upstream release
        run: |
          UPSTREAM_VERSION=$(sed -n 's/^upstream_version=//p' .github/beiapi-version-base)
          [[ "$UPSTREAM_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags https://github.com/router-for-me/CLIProxyAPI.git "refs/tags/${UPSTREAM_VERSION}:refs/tags/${UPSTREAM_VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build metadata
        run: |
          VERSION=$(bash .github/scripts/beiapi-version.sh)
          test "$GITHUB_REF_NAME" = "$VERSION"
          git merge-base --is-ancestor HEAD origin/beiapi-production
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: |
            ghcr.io/yorick-ryu/cli-proxy-api:beiapi-production
            ghcr.io/yorick-ryu/cli-proxy-api:sha-${{ github.sha }}
            ghcr.io/yorick-ryu/cli-proxy-api:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Publish digest summary
        run: |
          echo '### BeiAPI CPA image' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ env.VERSION }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'ghcr.io/yorick-ryu/cli-proxy-api:sha-${{ github.sha }}' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
